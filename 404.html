<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000080">
  <meta name="robots" content="noindex, follow">
  <title>Page not found | Aiko Professionals</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root{color-scheme:light;--navy:#000080;--orange:#EA5C00;--deep:#050A30;--muted:#62677a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f6fa;color:var(--deep);font:16px/1.6 'DM Sans',Arial,sans-serif}
    main{width:min(100%,680px);padding:clamp(28px,7vw,64px);background:#fff;border:1px solid #e3e6ef;border-radius:24px;box-shadow:0 24px 70px #050a3010}
    .brand{display:inline-flex;align-items:center;gap:10px;color:var(--navy);font-weight:800;letter-spacing:-.03em}.mark{display:grid;place-items:center;width:42px;height:42px;background:var(--navy);color:white;border-radius:10px;position:relative}.mark:after{content:"";position:absolute;width:13px;height:4px;background:var(--orange);right:-3px;top:8px;transform:rotate(-40deg);border-radius:4px}
    .code{margin:42px 0 0;color:var(--orange);font-size:.85rem;font-weight:800;letter-spacing:.16em}h1{font-size:clamp(2.4rem,8vw,4.5rem);line-height:1.02;letter-spacing:-.06em;margin:12px 0 18px}p{max-width:440px;color:var(--muted);margin:0 0 28px}.button{display:inline-flex;align-items:center;gap:12px;padding:14px 20px;border-radius:999px;background:var(--navy);color:#fff;text-decoration:none;font-weight:700}.button:hover{background:var(--deep)}.accent{color:var(--orange)}
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="Aiko Professionals home"><span class="mark" aria-hidden="true">AP</span><span>Aiko Professionals</span></a>
    <p class="code">ERROR 404 · PAGE NOT FOUND</p>
    <h1>Looks like this page took a <span class="accent">wrong turn.</span></h1>
    <p>The page may have moved or the link may be out of date. Let's get you back to the right place.</p>
    <a class="button" href="/">Back to home <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
